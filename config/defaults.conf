# pi5-basics defaults. These are copied to /etc/pi5-basics.conf.
# Values: 1 = enabled, 0 = disabled
INSTALL_OPTIONAL_TOOLS=1
DISABLE_WIFI=1
DISABLE_BLUETOOTH=1
ENABLE_ZRAM=1
ENABLE_AUTO_UPDATES=1
LIMIT_JOURNAL=1
ENABLE_WATCHDOG=0
FAN_PRESENT=0
FAN_PROFILE=1
FAN_TEMPS="50000 60000 67500 75000"
FAN_SPEEDS="75 125 175 255"
FAN_HYST=5000
